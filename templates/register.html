{% extends 'base.html' %}
{% block content %}

<div class="min-h-[80vh] flex justify-center items-center py-12 px-4">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">
            Create Account
        </h2>

        <p class="text-center text-gray-500 mb-8">
            Create your account to continue
        </p>

        <form method="POST">

            {% csrf_token %}
            
            {% if form.errors %}
            <div class="bg-red-100 border border-red-300 text-red-700 p-4 rounded-lg mb-6 text-sm">
                {{ form.errors }}
            </div>
            {% endif %}
            
            <div class="mb-5">
                <label class="block font-semibold text-gray-700 mb-2">
                    Username
                </label>
                {{ form.username }}
            </div>
            <div class="mb-5">
                <label class="block font-semibold text-gray-700 mb-2">
                    Password
                </label>
                {{ form.password1 }}
            </div>
            <div class="mb-6">
                <label class="block font-semibold text-gray-700 mb-2">
                    Confirm Password
                </label>
                {{ form.password2 }}
            </div>

            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition">
                Register
            </button>
        </form>

        <p class="text-center mt-6 text-gray-600">
            Already have an account ?
            <a href="{% url 'login'%}" class="text-blue-600 hover:text-blue-800 font-semibold">
                Login
            </a>
        </p>
    </div>
</div>

{% endblock %}
