{% extends 'base.html' %}
{% block content %}

<section class="w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">

    <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-center text-blue-700 mb-6 sm:mb-10">
        Contact Us
    </h1>

    <div class="bg-white rounded-2xl sm:rounded-3xl shadow-xl p-5 sm:p-8 lg:p-10">

        <p class="text-base sm:text-lg text-gray-600 text-center leading-7 sm:leading-8 mb-8">
            Have a question, suggestion or feedback? 
            Feel free to get in touch with us.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 bg-green-50 border border-green-200 text-green-700 rounded-lg p-4 text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-5">
                <label class="block font-semibold text-gray-700 mb-2">
                    Name
                </label>

                <input type="text" name="name" required class="w-full border-gray-300 rounded-lg
                 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your name">
            </div>

             <div class="mb-5">
                <label class="block font-semibold text-gray-700 mb-2">
                    Email
                </label>

                <input type="email" name="email" required class="w-full border-gray-300 rounded-lg
                 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your email">
            </div>

             <div class="mb-6">
                <label class="block font-semibold text-gray-700 mb-2">
                    Message
                </label>

                <textarea name="message" rows="5" 
                 required 
                 class="w-full border-gray-300 rounded-lg
                    px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" resize-y 
                 placeholder="Write your message">
                </textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg
                 font-semibold transition">
                 Send Message
                </button>
            </div>
            
        </form>
    </div>
</section>

{% endblock %}
