{% extends 'base.html' %}
{% block content %}

<div class=" min-h-[80vh] flex justify-center items-center py-12 px-4">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-blue-800 mb-2">
            Welcome Back
        </h2>

        <p class="text-center text-gray-500 mb-8">
            Login to continue to your account
        </p>

        <form method="POST">

            {% csrf_token %}

            {% if form.errors %}
            <div class="bg-red-100 border border-red-300 text-red-700 p-4 rounded-lg mb-6 text-sm">
                {{ form.errors }}
            </div>
            {% endif %}

            <div class="mb-5">

                <label class="block font-semibold text-gray-700 mb-2">
                    Username
                </label>
                <input type="text" name="username" value="{{ form.username.value|default:'' }}" placeholder="Enter your username"
                  required class="w-full px-4 py-3 border border-gray-300 rounded-xl focuse:outline-none focuse:ring-2
                  focuse:ring-blue-500 font-border-blue-500 transition">
            </div>

            <div class="mb-6">

                <label class="block font-semibold text-gray-700 mb-2">
                    Password
                </label>
                <input type="password" name="password" placeholder="Enter your password"
                  required class="w-full px-4 py-3 border border-gray-300 rounded-xl focuse:outline-none focuse:ring-2
                  focuse:ring-blue-500 font-border-blue-500 transition">
            </div>


            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition">
                Login
            </button>
        </form>

        <p class="text-center mt-6 text-gray-600">
            Don't have an account ?

            <a href="{% url 'register' %}" class="text-blue-600 hover:text-blue-800 font-semibold">
                Register
            </a>
        </p>
    </div>
</div>

{% endblock %}
